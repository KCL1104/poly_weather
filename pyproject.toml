[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polyweather"
version = "0.1.0"
description = "Read-only paper-trading research system for Polymarket daily temperature markets"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "websockets>=13",
  "pyarrow>=15",
  "tzdata",
]

[project.optional-dependencies]
research = ["numpy", "pandas", "scipy", "statsmodels"]
ecmwf = ["eccodes>=2.37", "numpy"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
polyweather = "polyweather.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/polyweather"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
