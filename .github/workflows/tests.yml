# Unit tests on Linux, Windows and macOS for every push that touches the program.
#
# The "live" jobs start the real system for a few minutes against the public data
# sources, the way a home computer would: scripts/start.sh, scripts\start.bat and
# docker compose. They run only on request: from the Actions tab ("Run workflow"),
# or for a commit whose message contains [live].
name: tests

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - ".github/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --disable-pip-version-check ".[dev,ecmwf]"
      - name: Test
        run: python -m pytest -q -rs

  live-native:
    name: live run without Docker (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[live]')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start with scripts/start.sh, stop after 5 minutes
        if: runner.os != 'Windows'
        run: scripts/start.sh --duration 300 > run.log 2>&1
      - name: Start with scripts\start.bat, stop after 5 minutes
        if: runner.os == 'Windows'
        shell: cmd
        run: call scripts\start.bat --duration 300 > run.log 2>&1
      - name: Output of the run
        if: always()
        shell: bash
        run: cat run.log
      - name: Check what was recorded
        shell: bash
        run: |
          py=.venv/bin/python; [ -x "$py" ] || py=.venv/Scripts/python.exe
          "$py" -m polyweather.cli status
          "$py" .github/scripts/check_run.py data run.log

  live-docker:
    name: live run with docker compose
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[live]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up -d --build
      - name: Wait until the container reports healthy
        run: |
          for i in $(seq 1 60); do
            state=$(docker inspect polyweather-polyweather-1 --format '{{.State.Health.Status}}')
            echo "$(date -u +%T) $state"
            [ "$state" = healthy ] && exit 0
            sleep 10
          done
          exit 1
      - name: Let it record, then look
        run: |
          sleep 180
          docker compose exec -T polyweather polyweather status
          docker compose exec -T polyweather polyweather backup
          ls -la data/backup
      - name: Stop, start again, stop
        run: |
          docker compose stop
          test "$(docker inspect polyweather-polyweather-1 --format '{{.State.ExitCode}}')" = 0
          docker compose up -d
          sleep 45
          docker compose exec -T polyweather polyweather status --check
          docker compose logs --no-color > run.log 2>&1
          docker compose exec -T polyweather python - < .github/scripts/check_run.py /data || exit 1
          docker compose down
      - name: Output of the run
        if: always()
        run: cat run.log || docker compose logs --no-color

  live-systemd:
    name: live run as systemd services (deploy/install.sh)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[live]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install with deploy/install.sh
        run: sudo ./deploy/install.sh
      - name: Services are running and all seven timers are scheduled
        run: |
          systemctl is-active polyweather-recorder.service polyweather-metar.service
          systemctl list-timers 'polyweather-*' --no-pager
          test "$(systemctl list-timers 'polyweather-*' --no-pager | grep -c 'polyweather-.*\.timer')" = 7
      - name: Let it record, and run scheduled jobs once by hand
        run: |
          sleep 180
          for job in catalog nbm lamp check-settlement; do
            sudo systemctl start polyweather-$job.service
            echo "$job: $(systemctl show polyweather-$job.service -p Result --value)"
          done
          sudo -u polyweather env POLYWEATHER_DATA_DIR=/var/lib/polyweather /opt/polyweather/.venv/bin/polyweather status
      - name: Run install.sh a second time (an update must keep data and settings)
        run: |
          before=$(systemctl show polyweather-recorder.service -p MainPID --value)
          sudo ./deploy/install.sh
          systemctl is-active polyweather-recorder.service polyweather-metar.service
          after=$(systemctl show polyweather-recorder.service -p MainPID --value)
          echo "recorder process before the update: $before, after: $after"
          test "$before" != "$after"   # the update restarted it, so it runs the new code
      - name: Stop and check what was recorded
        run: |
          sleep 60
          sudo systemctl stop polyweather-recorder.service polyweather-metar.service
          sudo journalctl -u polyweather-recorder.service --no-pager -o cat > /tmp/polyweather-run.log
          sudo -u polyweather /opt/polyweather/.venv/bin/python /opt/polyweather/.github/scripts/check_run.py /var/lib/polyweather /tmp/polyweather-run.log
      - name: Journal
        if: always()
        run: sudo journalctl -u 'polyweather-*' --no-pager -o short | tail -150

